[tasks.new]
description = "Create a post file from the template."
usage = 'arg "<slug>" help="The file name for the post, in kebab-case and without an extension."'
run = '''
#!/usr/bin/env bash
set -euo pipefail
file="src/content/posts/${usage_slug}.md"
if [ -e "$file" ]; then
    echo "Error: $file already exists" >&2
    exit 1
fi
cat > "$file" <<EOF
---
title: ""
date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
tags: [""]
draft: true
---
EOF
echo "Created $file"
'''

[tasks.touch]
description = "Set the updated frontmatter field of a post to the current time."
usage = 'arg "<file>" help="The path to the post file."'
run = '''
#!/usr/bin/env bash
set -euo pipefail
file="$usage_file"
if [ ! -e "$file" ]; then
    echo "Error: $file not found" >&2
    exit 1
fi
if [ "$(head -n1 "$file")" != "---" ]; then
    echo "Error: $file has no frontmatter (first line not '---')" >&2
    exit 1
fi
now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
tmp=$(mktemp)
awk -v now="$now" '
    BEGIN { infm=0; done=0; seen=0 }
    /^---[[:space:]]*$/ {
        if (!seen) { seen=1; infm=1; print; next }
        if (infm)  { if (!done) print "updated: " now; infm=0; done=1; print; next }
    }
    infm && !done && /^updated:[[:space:]]*/ { print "updated: " now; done=1; next }
    { print }
' "$file" > "$tmp" && mv "$tmp" "$file"
echo "$file -> $now"
'''

[tasks.preview]
description = "Build the site and serve it on a local preview server."
run = ["bun run build", "bun run preview"]

[tasks.commit]
description = "Run the precommit script, stage all changes, and commit them."
usage = 'arg "<message>" help="The commit message."'
run = [
    "bun run precommit",
    "git add --all",
    'git commit -m "$usage_message"',
]

[tasks.deploy]
description = "Push master to the remote. This starts the deployment."
run = "git push -u origin master"

[tasks.doit]
description = "Commit all changes with a default message, then deploy."
run = [
    "mise run commit 'just do it 🫶'",
    "mise run deploy"
]
