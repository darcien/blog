name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment: prod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # node_modules/.astro caches optimized images. Cache keys are immutable,
      # so a static key would freeze the cache and re-encode every newly added
      # image forever. Instead the per-commit key is always a miss, and
      # restore-keys pulls the previous build's cache so only changed images
      # get re-encoded.
      - name: Restore Astro cache
        id: astro-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-${{ runner.os }}-

      # Expected false (only restore-keys matches); confirms images were
      # restored from cache rather than re-encoded from scratch.
      - run: |
          echo "astro cache-hit=${{ steps.astro-cache.outputs.cache-hit }} matched-key=${{ steps.astro-cache.outputs.cache-matched-key }}"

      - run: bun run build

      # Exact key never hits, so this always runs and saves this build's
      # optimized images for the next one to restore.
      - name: Save Astro cache
        if: steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | ssh-add -
          rsync -az --delete dist/ deploy-blog@"$VPS_HOST":/srv/blog/
